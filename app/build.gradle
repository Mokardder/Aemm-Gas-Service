android {
    namespace 'android.iocl.dac_collector'
    compileSdk 34

    def _versionCode = 0
    def _major = 0
    def _minor = 0
    def _patch = 0

    def versionPropsFile = file('version.properties')
    def keystoreProperties = new Properties()
    def keystoreFile = file("keystore.properties")
    keystoreProperties.load(new FileInputStream(keystoreFile))

    if (!versionPropsFile.canRead()) {
        throw new GradleException("Could not read version.properties!")
    }

    def versionProps = new Properties()
    versionPropsFile.withInputStream { versionProps.load(it) }

    _major = versionProps['MAJOR'].toInteger()
    _minor = versionProps['MINOR'].toInteger()
    _patch = versionProps['PATCH'].toInteger()
    _versionCode = versionProps['VERSION_CODE'].toInteger()

    def releaseOutputTasks = [':app:assembleRelease', ':app:bundleRelease']
    def requestedReleaseOutput = gradle.startParameter.taskNames.any { requestedTask ->
        releaseOutputTasks.contains(requestedTask.startsWith(':')
                ? requestedTask
                : ":app:${requestedTask}")
    }

    if (requestedReleaseOutput) {
        _patch++
        _versionCode++

        if (_patch >= 20) {
            _patch = 0
            _minor++
        }
        if (_minor >= 10) {
            _minor = 0
            _major++
        }

        def nextVersionProps = new Properties()
        nextVersionProps.putAll(versionProps)
        nextVersionProps['MAJOR'] = _major.toString()
        nextVersionProps['MINOR'] = _minor.toString()
        nextVersionProps['PATCH'] = _patch.toString()
        nextVersionProps['VERSION_CODE'] = _versionCode.toString()

        gradle.buildFinished { result ->
            def releaseOutputWasBuilt = gradle.taskGraph.allTasks.any { task ->
                releaseOutputTasks.contains(task.path)
            }
            if (result.failure == null && releaseOutputWasBuilt) {
                versionPropsFile.withOutputStream { nextVersionProps.store(it, null) }
            }
        }
    }

    def _appVersionName = "${_major}.${_minor}.${_patch}-${_versionCode}"

    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        resConfigs "en"
    }


    defaultConfig {
        applicationId "android.iocl.dac_collector"
        minSdk 23
        targetSdk 33
        versionCode _versionCode
        versionName _appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"


        ndk {
            // Only include ARM 32-bit and 64-bit
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
        vectorDrawables.useSupportLibrary = true

        externalNativeBuild {
            cmake {
                cppFlags ""
                arguments "-DANDROID_PLATFORM=android-23"
            }
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            def name = "Aemm_V${_appVersionName}-${variant.name}.apk"
            output.outputFileName = name
        }
    }
    signingConfigs {
        release {
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
    }



// TODO: Always Check for Publication


    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            debuggable false

        }
    }




