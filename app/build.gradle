    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main {
            res.srcDirs += 'src/main/res_simple_keyboard'
//            jniLibs.srcDirs = ["libs"]
        }
    }

    packagingOptions {
        pickFirst 'lib/armeabi-v7a/libkeepalive.so'
        pickFirst 'lib/arm64-v8a/libkeepalive.so'
    }
}


