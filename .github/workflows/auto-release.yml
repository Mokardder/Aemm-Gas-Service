name: Android Auto Release

on:
  push:
    branches:
      - master   # triggers on every push to master


permissions:
  contents: write   # needed for creating releases      

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Make Gradle wrapper executable (fix for exit code 126)
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 3. Set up JDK 17
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 4. Build the release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # 5. Get last commit message
      - name: Get commit message
        id: commit_msg
        run: echo "COMMIT_MSG=$(git log -1 --pretty=%B)" >> $GITHUB_ENV

      # 6. Get version from version.properties
      - name: Read version.properties
        run: |
          PATCH=$(grep PATCH version.properties | cut -d '=' -f2)
          MINOR=$(grep MINOR version.properties | cut -d '=' -f2)
          MAJOR=$(grep MAJOR version.properties | cut -d '=' -f2)
          VERSION_CODE=$(grep VERSION_CODE version.properties | cut -d '=' -f2)
          echo "APP_VERSION=${MAJOR}.${MINOR}.${PATCH}-${VERSION_CODE}" >> $GITHUB_ENV

      # 7. Create GitHub Release with APK
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: "Release ${{ env.APP_VERSION }}"
          body: ${{ env.COMMIT_MSG }}
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
