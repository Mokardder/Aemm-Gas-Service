name: Android Auto Debug Build

on:
  push:
    branches:
      - master   # triggers on every push to master

permissions:
  contents: write   # needed for creating releases

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up JDK 17
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3. Build the debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 4. Get last commit message
      - name: Get commit message
        id: commit_msg
        run: echo "COMMIT_MSG=$(git log -1 --pretty=%B)" >> $GITHUB_ENV

      # 5. Create GitHub Release with APK
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.run_number }}
          name: "Debug Build ${{ github.run_number }}"
          body: ${{ env.COMMIT_MSG }}
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
