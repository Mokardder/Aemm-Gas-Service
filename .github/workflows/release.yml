name: Create Release

on:
  push:
    branches:
      - main  # Change this to your default branch name if it's different

jobs:
  create_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Git
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release ${{ github.run_number }}
          body: |
            Automated release based on push to main branch.
          draft: false
          prerelease: false

      - name: Zip Source Code
        run: zip -r source_code.zip .

      - name: Upload Source Code
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: source_code.zip
          asset_name: source_code.zip
          asset_content_type: application/zip

      - name: Upload APK File
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: app/build/outputs/apk/release/app-release.apk  # Change this to the path of your APK file
          asset_name: app-release.apk
          asset_content_type: application/vnd.android.package-archive
